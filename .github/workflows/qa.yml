name: EMS Strict QA

on:
  push:
  pull_request:

jobs:
  python-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Syntax gate
        run: python -m py_compile backend/main.py backend/alembic/env.py backend/alembic/versions/0001_ems_baseline.py pi_firmware/*.py frontend/test_system.py
      - name: Strict release gate
        run: python qa/strict_6_4_1_check.py
      - name: Shell syntax
        run: bash -n pi_firmware/setup_pi.sh qa/run_energy_regression.sh

  energy-regression:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5433/ems_fresh
      SECRET_KEY: ci-only-secret-key-not-for-production
      EMS_BOOTSTRAP_PASSWORD: 'Boot#Pass123'
      EMS_TRUSTED_ORIGINS: http://localhost:3000
      COOKIE_SECURE: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r backend/requirements.txt requests
      - name: E1 + E3 (Pi energy core + allocation policy, mocked RS485/GPIO)
        run: bash qa/run_energy_regression.sh
      - name: PostgreSQL on :5433 (ems_fresh) for E2
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql
          sudo sed -i 's/^port = .*/port = 5433/' /etc/postgresql/*/main/postgresql.conf
          sudo systemctl restart postgresql
          sudo -u postgres psql -p 5433 -c "ALTER USER postgres PASSWORD 'postgres'"
          sudo -u postgres createdb -p 5433 ems_fresh
      - name: Migrate + start backend :8001 + bootstrap super admin
        working-directory: backend
        run: |
          alembic upgrade head
          nohup uvicorn main:app --host 127.0.0.1 --port 8001 > /tmp/backend.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8001/api/health && break; sleep 1; done
          curl -sf -X POST http://127.0.0.1:8001/api/bootstrap
      - name: E2 (backend energy ingest + API, live backend)
        run: sudo -E "$(which python)" qa/energy_e2_test.py
      - name: E4 (energy UI structure + compiled helpers + live API contract)
        run: sudo -E "$(which python)" qa/energy_e4_test.py
      - name: Backend log on failure
        if: failure()
        run: tail -n 100 /tmp/backend.log || true

  frontend-validation:
    name: Frontend validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: frontend
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      # Next config requires a rewrite target; no backend runs in this job.
      # This build-only artifact is not deployed.
      EMS_BACKEND_URL: http://127.0.0.1:9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Record checked-out revision and toolchain
        id: revision
        run: |
          printf 'sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          printf 'Checked-out revision: `%s`\n' "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          node --version
          npm --version
      - name: Install locked frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Generate Next.js route types
        run: ./node_modules/.bin/next typegen
      - name: TypeScript check
        run: ./node_modules/.bin/tsc --noEmit --incremental false
      - name: Offline frontend regressions
        run: |
          node --test \
            ../qa/bill_editor_changes.test.cjs \
            ../qa/controller_health.test.cjs \
            ../qa/generation_adjustment_date.test.cjs \
            ../qa/manual_generation_policy.test.cjs \
            ../qa/mode_consumption_comparison.test.cjs
      - name: Production build
        run: npm run build
      - name: Verify final revision and tracked files
        env:
          CHECKED_OUT_SHA: ${{ steps.revision.outputs.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$CHECKED_OUT_SHA"
          git diff --exit-code
          git diff --cached --exit-code
          printf 'Frontend validation passed for `%s`.\n' "$CHECKED_OUT_SHA" >> "$GITHUB_STEP_SUMMARY"
